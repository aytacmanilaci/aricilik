<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Arıcılık AI Analiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
    <style>
        :root{ --h:#D4860A; --dk:#121008; --tx:#EDE9E3; --br:#2E2B26; }
        body{ margin:0; font-family:sans-serif; background:var(--dk); color:var(--tx); display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        header{ background:#1A1714; padding:10px 15px; border-bottom:1px solid var(--br); display:flex; justify-content:space-between; align-items:center; }
        #main{ display:flex; flex:1; overflow:hidden; }
        #sidebar{ width:280px; border-right:1px solid var(--br); padding:10px; overflow-y:auto; }
        #map{ flex:1; background:#000; }
        #analysis{ width:320px; border-left:1px solid var(--br); padding:15px; overflow-y:auto; }
        .inp{ width:100%; padding:8px; margin-bottom:5px; background:#222; border:1px solid var(--br); color:#fff; outline:none; border-radius:3px; box-sizing:border-box; }
        .btn{ width:100%; padding:10px; background:var(--h); border:none; color:#000; font-weight:bold; cursor:pointer; border-radius:3px; margin-bottom:5px; }
        .btn:hover{ background:#F5A623; }
        .ana-card{ background:#1A1714; border-left:4px solid var(--h); padding:15px; margin-top:10px; line-height:1.7; font-size:14px; }
        .spin{ width:30px; height:30px; border:3px solid #333; border-top-color:var(--h); border-radius:50%; animation:s .6s linear infinite; margin:20px auto; }
        @keyframes s{to{transform:rotate(360deg);}}
        .hive-item{ padding:8px; border-bottom:1px solid var(--br); cursor:pointer; }
        .hive-item:hover{ background:#1A1714; }
    </style>
</head>
<body>

<header>
    <div style="color:var(--h); font-weight:bold; font-size:18px;">🍯 Arıcılık AI</div>
    <div id="status" style="font-size:12px; color:#888;">Haritaya tıklayın</div>
</header>

<div id="main">
    <div id="sidebar">
        <input class="inp" id="name" placeholder="Arılık Adı">
        <input class="inp" id="coords" placeholder="Haritaya tıklayın..." readonly>
        <button class="btn" id="addBtn">🐝 Ekle ve Analiz Et</button>
        <button class="btn" id="keyBtn" style="background:#333; color:#aaa; font-weight:normal;">🔑 API Key Değiştir</button>
        <div id="list" style="margin-top:10px;"></div>
    </div>
    <div id="map"></div>
    <div id="analysis">
        <div style="color:#888; text-align:center; margin-top:50px; line-height:1.8;">
            🗺 Haritaya tıkla<br>konum seç<br><br>
            🐝 Ekle ve Analiz Et<br>butonuna bas
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
    const API_URL = "https://api.anthropic.com/v1/messages";
    
    function getKey(){ return localStorage.getItem('anthropic_key'); }
    function setKey(k){ localStorage.setItem('anthropic_key',k); }

    // Ask for key if not set
    if(!getKey()){
        var k = prompt('Google Gemini API Key gir (sk-ant-...):');
        if(k) setKey(k);
    }

    document.getElementById('keyBtn').onclick = function(){
        var k = prompt('Yeni Anthropic API Key:', getKey()||'');
        if(k) { setKey(k); alert('Key kaydedildi!'); }
    };

    const map = L.map('map').setView([60.20, 24.65], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OSM'}).addTo(map);

    var marker;
    map.on('click', function(e){
        if(marker) map.removeLayer(marker);
        marker = L.marker(e.latlng).addTo(map);
        document.getElementById('coords').value = e.latlng.lat.toFixed(6) + ", " + e.latlng.lng.toFixed(6);
        document.getElementById('status').textContent = '📍 Konum seçildi';
    });

    var hives = JSON.parse(localStorage.getItem('hives')||'[]');
    renderList();

    document.getElementById('addBtn').onclick = async function(){
        var coords = document.getElementById('coords').value;
        var name = document.getElementById('name').value || ('Arılık ' + (hives.length+1));
        var apiKey = getKey();

        if(!coords){ alert('Önce haritadan konum seçin!'); return; }
        if(!apiKey){ alert('API Key gerekli!'); return; }

        var ana = document.getElementById('analysis');
        ana.innerHTML = '<div class="spin"></div><p style="text-align:center;color:#888;">AI analiz yapıyor...<br>30-60 saniye sürebilir</p>';
        document.getElementById('status').textContent = '⏳ Analiz yapılıyor...';

        var prompt = 'Sen bir Finlandiya arıcılık uzmanısın. ' +
            'Koordinat: ' + coords + ' (Finlandiya). ' +
            'Bu koordinat için Türkçe arıcılık analizi yap:\n\n' +
            '1. 📍 Tam konum (il/ilçe/köy)\n' +
            '2. 🌿 Bölgedeki başlıca nektar bitkileri (Fince isimleriyle)\n' +
            '3. 📅 Nektar takvimi (hangi ay hangi bitki)\n' +
            '4. 📊 Arıcılık skoru (1-100) ve açıklama\n' +
            '5. 🧭 Önerilen kovan yönü\n' +
            '6. ⚠️ Dikkat edilmesi gerekenler\n\n' +
            'Gerçek verilerle yanıtla, tahmin yapma.';

        try{
            var res = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01',
                    'anthropic-dangerous-direct-browser-access': 'true'
                },
                body: JSON.stringify({
                    model: 'claude-sonnet-4-20250514',
                    max_tokens: 1000,
                    messages: [{role: 'user', content: prompt}]
                })
            });

            var data = await res.json();

            if(data.error) throw new Error(data.error.message);

            var text = (data.content||[]).map(function(i){return i.text||'';}).join('');
            text = text.replace(/\n/g, '<br>');

            ana.innerHTML = '<div class="ana-card"><strong style="color:var(--h);font-size:15px;">📍 ' + name + '</strong><br><small style="color:#888;">' + coords + '</small><br><br>' + text + '</div>';

            // Save hive
            hives.push({name:name, coords:coords, ts:Date.now()});
            localStorage.setItem('hives', JSON.stringify(hives));
            document.getElementById('name').value = '';
            renderList();
            document.getElementById('status').textContent = '✅ Analiz tamamlandı';

        }catch(e){
            ana.innerHTML = '<div style="color:#ff6b6b;padding:15px;line-height:1.8;">⚠️ Hata: ' + e.message + '</div>';
            document.getElementById('status').textContent = '❌ Hata oluştu';
        }
    };

    function renderList(){
        var el = document.getElementById('list');
        if(!hives.length){ el.innerHTML = '<div style="color:#666;font-size:12px;padding:10px;">Henüz arılık yok.</div>'; return; }
        el.innerHTML = hives.slice().reverse().map(function(h,i){
            return '<div class="hive-item">🟡 ' + h.name + '<br><small style="color:#666;">' + h.coords + '</small></div>';
        }).join('');
    }
</script>
</body>
</html>
