<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Espoo Beekeeping AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
    <style>
        :root{ --h:#D4860A; --dk:#121008; --tx:#EDE9E3; --br:#2E2B26; }
        body{ margin:0; font-family:sans-serif; background:var(--dk); color:var(--tx); display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        header{ background:#1A1714; padding:10px; border-bottom:1px solid var(--br); display:flex; justify-content:space-between; }
        #main{ display:flex; flex:1; }
        #sidebar{ width:280px; border-right:1px solid var(--br); padding:10px; overflow-y:auto; }
        #map{ flex:1; background:#000; }
        #analysis{ width:320px; border-left:1px solid var(--br); padding:15px; overflow-y:auto; }
        .inp{ width:100%; padding:8px; margin-bottom:5px; background:#222; border:1px solid var(--br); color:#fff; outline:none; }
        .btn{ width:100%; padding:10px; background:var(--h); border:none; color:#000; font-weight:bold; cursor:pointer; }
        .ana-card{ background:#1A1714; border-left:4px solid var(--h); padding:15px; margin-top:10px; line-height:1.6; }
        .spin{ width:30px; height:30px; border:3px solid #333; border-top-color:var(--h); border-radius:50%; animation:s .6s linear infinite; margin:20px auto; }
        @keyframes s{to{transform:rotate(360deg);}}
    </style>
</head>
<body>

<header>
    <div style="color:var(--h); font-weight:bold;">🍯 Espoo Beekeeping</div>
    <div id="status" style="font-size:12px; color:#888;">Sistem Hazır</div>
</header>

<div id="main">
    <div id="sidebar">
        <input class="inp" id="name" placeholder="Arılık Adı">
        <input class="inp" id="coords" placeholder="Haritaya Tıklayın" readonly>
        <button class="btn" id="addBtn">🐝 Ekle ve Analiz Et</button>
        <div id="list" style="margin-top:20px;"></div>
    </div>
    <div id="map"></div>
    <div id="analysis">
        <div style="color:#888; text-align:center; margin-top:50px;">Analiz için haritadan bir konum seçin.</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
    // TIER 1 ONAYLI ANAHTARINIZ
    const API_KEY = "AIzaSyBSg1ljJlyGOVp2Lg50dBv3GC46s0LVGpg";
    // STABİL v1 SÜRÜMÜ
    const API_URL = "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent";

    const map = L.map('map').setView([60.20, 24.65], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let marker;
    map.on('click', e => {
        if(marker) map.removeLayer(marker);
        marker = L.marker(e.latlng).addTo(map);
        document.getElementById('coords').value = e.latlng.lat.toFixed(6) + "," + e.latlng.lng.toFixed(6);
    });

    document.getElementById('addBtn').onclick = async () => {
        const c = document.getElementById('coords').value;
        const n = document.getElementById('name').value || "Yeni Arılık";
        if(!c) return alert("Lütfen haritadan konum seçin.");

        const ana = document.getElementById('analysis');
        ana.innerHTML = '<div class="spin"></div><p style="text-align:center">AI Espoo Florasını İnceliyor...</p>';

        try {
            const res = await fetch(`${API_URL}?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Koordinat: ${c}. Espoo Finlandiya için kısa arıcılık flora raporu hazırla (Türkçe).` }] }]
                })
            });
            const data = await res.json();
            
            if(data.error) throw new Error(data.error.message);
            
            const text = data.candidates[0].content.parts[0].text;
            ana.innerHTML = `<div class="ana-card"><strong>📍 ${n}</strong><br><br>${text}</div>`;
            
            const li = document.createElement('div');
            li.style.padding = "10px";
            li.style.borderBottom = "1px solid #2e2b26";
            li.innerHTML = `🟡 ${n}`;
            document.getElementById('list').prepend(li);
        } catch (e) {
            ana.innerHTML = `<div style="color:#ff6b6b; padding:10px; font-size:13px;">⚠️ Hata: ${e.message}<br><br><b>Çözüm:</b> Tarayıcıda izleme engelleyiciyi kapatın veya dosyayı Gizli Sekmede açın.</div>`;
        }
    };
</script>
</body>
</html>
